# Pings the live app every 10 minutes so Render's free plan doesn't put it to sleep.
name: Keep Eventique awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://eventique-k2aj.onrender.com/api/health || true
