# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
# You only need to paste MONGO_URI (from a free MongoDB Atlas cluster). Everything else has safe test-mode defaults.
services:
  - type: web
    name: eventique
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "false"      # "true" fills an EMPTY database with demo vendors and logins (for demos only)
      - key: OTP_PROVIDER
        value: auto        # email when EMAIL_WEBHOOK_* are set, else Twilio when TWILIO_* are set, else the OTP shows on screen
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
      - key: DEMO_PHONES
        sync: false        # leave unset in production; demo numbers log in with DEMO_OTP
      - key: DEMO_OTP
        value: "123456"
      - key: ADMIN_INVITE_CODE
        sync: false        # secret code needed to create an admin account in the Admin app
      - key: OTP_FALLBACK_SCREEN
        value: "false"
      - key: RESET_DATA
        sync: false        # set to a new word once to wipe all users and records (keeps categories)
      - key: STORAGE
        sync: false        # cloudinary in production, so photos survive redeploys
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
